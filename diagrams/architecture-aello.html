<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aello — architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper:   #0f1a1e;
      --ink:     #ffffff;
      --muted:   #888888;
      --accent:  #97fce4;
      --rule:    #242424;
      --font-sans: 'Geist', Inter, system-ui, sans-serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: linear-gradient(180deg, #091b1b 0%, #03100f 100%);
      background-attachment: fixed;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.375rem, 2.2vw + 0.75rem, 2rem);
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: var(--ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>aello — how a blueprint becomes an isolated environment</h1>

      <rect width="100%" height="100%" fill="#0f1a1e"/>

      <text x="294" y="116" fill="#888888" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">AELLO</text>

      <rect x="496" y="216" width="464" height="264" rx="8" fill="rgba(255,255,255,0.02)" stroke="#242424" stroke-width="1"/>

      <text x="566" y="228" fill="#888888" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PROJECT DIRECTORY</text>

      <rect x="716" y="268" width="56" height="12" fill="#0f1a1e"/>

      <rect x="624" y="356" width="72" height="12" fill="#0f1a1e"/>
      <text x="660" y="364" fill="#888888" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRANSCRIPTS</text>

      <text x="356" y="440" fill="#ffffff" font-size="12" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">Skill templates</text>
      <text x="356" y="456" fill="#888888" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">include_dir!</text>

      <!-- isolated env (FOCAL) -->
      <rect x="528" y="248" width="176" height="80" fill="#0f1a1e"/>
      <rect x="528" y="248" width="176" height="80" fill="rgba(151,252,228,0.10)" stroke="#97fce4" stroke-width="1.2"/>
      <rect x="536" y="256" width="28" height="12" fill="none" stroke="rgba(151,252,228,0.40)" stroke-width="1"/>

      <!-- agent process -->
      <rect x="784" y="248" width="160" height="80" fill="#0f1a1e"/>

      <!-- ============ legend ============ -->

      <rect x="152" y="540" width="12" height="12" fill="rgba(151,252,228,0.10)" stroke="#97fce4" stroke-width="1"/>

      <rect x="472" y="540" width="12" height="12" fill="#0b1114" stroke="#404040" stroke-width="1"/>
      <text x="492" y="548" fill="#888888" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">STATE ON DISK</text>

      <rect x="632" y="540" width="12" height="12" fill="#061312" stroke="#374151" stroke-width="1"/>
      <text x="652" y="548" fill="#888888" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SPAWNED PROCESS</text>

  </div>
</body>
