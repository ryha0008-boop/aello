name: release

# Every push to main runs the test suite on Linux and Windows, then auto-bumps the
# patch version (+0.0.1), commits the bumped Cargo.toml back, then builds the
# binaries from it and publishes TWO releases:
#
#   1. an immutable `vX.Y.Z` release — marked as GitHub's "Latest release".
#      Package managers (Homebrew/Scoop/winget) need a versioned URL whose
#      assets never change, and users need to be able to pin or roll back.
#   2. the rolling `latest` tag — same assets, clobbered every build.
#      `install.sh` and every already-installed binary hard-code that download
#      URL, so it has to keep working forever.
#
# Patch is automatic; bump minor/major by hand in Cargo.toml for big updates.
# The bump only happens when the version in Cargo.toml has ALREADY been released
# (a `vX.Y.Z` tag exists). A version a human set by hand is published exactly as
# written — otherwise a deliberate 0.2.0 would ship as 0.2.1, since a patch bump
# can only ever produce X.Y.(Z+1) and the intended version would never exist.
# The bump commit is pushed with GITHUB_TOKEN, which does NOT re-trigger
# workflows, so there is no infinite loop.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Runs before `bump` so a red suite blocks the version bump too — a bump commit
  # pushed for a build that then fails leaves a version that was never released,
  # and the next push bumps again past it.
  #
  # It runs on the pushed commit rather than the bump commit: the bump changes only
  # the version string, so this is the code that ships.
  #
  # Both platforms on purpose. The suite had only ever run where a human ran it —
  # Windows, here — and nothing had ever executed it on Linux, which is where the
  # cross-platform assumptions actually break (path separators, case sensitivity,
  # and the CRLF normalisation the hook-digest tests do explicitly so a Windows
  # checkout and Linux CI can agree). macOS is deliberately not covered: it builds
  # from source only and no runner time is spent proving it twice.
  #
  # No `--locked`: the bump job commits a new Cargo.toml version without touching
  # Cargo.lock, so from the next push onward the lockfile's recorded version trails
  # by one and `--locked` would fail every run on a mismatch that means nothing.
  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  bump:
    name: resolve version
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          # Tags decide whether this version was already released, so they have
          # to be present — a shallow checkout without them would look like
          # "nothing is released yet" and republish the current version forever.
          fetch-depth: 0
          fetch-tags: true
      - name: resolve the version to release
        id: bump
        run: |
          cur=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if git rev-parse -q --verify "refs/tags/v$cur" >/dev/null; then
            # Already released → this is an ordinary push, so patch-bump it.
            IFS=. read -r MA MI PA <<< "$cur"
            new="$MA.$MI.$((PA + 1))"
            # Replace only the first (package) version line — dep versions are not at column 0.
            sed -i -E "0,/^version = .*/s//version = \"$new\"/" Cargo.toml
            echo "bumped $cur -> $new"
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "release: v$new [skip ci]"
            git push origin main
          else
            # A human set this version by hand (a minor/major bump). Ship it
            # unchanged: a patch bump can only ever produce X.Y.(Z+1), so
            # bumping here would make a deliberate 0.2.0 come out as 0.2.1 and
            # the intended version would never exist as a tag.
            new="$cur"
            echo "releasing $new as set in Cargo.toml (no tag v$new yet)"
          fi
          echo "version=$new" >> "$GITHUB_OUTPUT"
          # Tag the exact commit we are releasing, not "whatever main points at later".
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.asset }}
    needs: bump
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: aello-x86_64-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: aello-x86_64-windows.exe
          # macos-latest runners are Apple Silicon; the Intel build is a
          # cross-compile from the same runner (Apple's clang links both).
          # Both are unsigned — see the README's Gatekeeper note.
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: aello-aarch64-macos
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: aello-x86_64-macos
    steps:
      # Check out the bump commit so the binary reports the new version.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: stage binary
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/aello"
          [ -f "$src.exe" ] && src="$src.exe"
          cp "$src" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    name: publish v${{ needs.bump.outputs.version }}
    needs: [bump, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: generate checksums
        # `aello update` verifies the downloaded binary against this manifest.
        # Hash only the aello-* binaries (not SHA256SUMS itself).
        run: (cd dist && sha256sum aello-* > SHA256SUMS && cat SHA256SUMS)
      - name: publish releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.bump.outputs.version }}
          SHA: ${{ needs.bump.outputs.sha }}
        run: |
          # `aello update` reads the build commit from the last whitespace token
          # of the release body — keep the sha last.
          notes="$(printf 'aello v%s\n\nInstall: https://github.com/%s#install\nChangelog: https://github.com/%s/blob/main/CHANGELOG.md\n\nbuild %s' \
            "$VERSION" "$GH_REPO" "$GH_REPO" "$SHA")"

          # 1. Immutable versioned release, tagged at the bump commit, and marked
          #    as GitHub's "Latest release" so /releases/latest resolves to a
          #    version a user can pin. Re-runnable: clobber if it already exists.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" dist/* --clobber
            gh release edit "v$VERSION" --title "v$VERSION" --notes "$notes" --draft=false --latest
          else
            gh release create "v$VERSION" dist/* --title "v$VERSION" --notes "$notes" --target "$SHA" --latest
          fi

          # 2. Rolling `latest` tag. Keep ONE permanent published release here and
          #    never delete it (delete+recreate intermittently produced a draft →
          #    404 on update); just clobber its assets and refresh title/notes.
          #    Explicitly NOT flagged --latest — the versioned release owns that.
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/* --clobber
            gh release edit latest --title "v$VERSION (rolling)" --notes "$notes" --draft=false --latest=false
          else
            gh release create latest dist/* --title "v$VERSION (rolling)" --notes "$notes" --latest=false
          fi
